services:
  traefik:
    image: traefik:v3.1
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--experimental.plugins.routewarden.modulename=github.com/routewarden/traefik-warden"
      - "--experimental.plugins.routewarden.version=v1.1.0"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  admin-portal:
    image: nginx:alpine
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.localhost`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.routers.admin.middlewares=ip-shield"

      # RouteWarden IP Whitelist Configuration
      - "traefik.http.middlewares.ip-shield.plugin.routewarden.enabled=true"
      - "traefik.http.middlewares.ip-shield.plugin.routewarden.enableDefaultPatterns=true"
      - "traefik.http.middlewares.ip-shield.plugin.routewarden.pathPatterns=(?i)^/admin(/.*)?$,(?i)^/metrics(/.*)?$"
      # Allowed trusted developer/VPN IPs and subnets
      - "traefik.http.middlewares.ip-shield.plugin.routewarden.allowedIps=10.0.0.0/8,192.168.1.100,172.20.0.50"
      - "traefik.http.middlewares.ip-shield.plugin.routewarden.response.mode=json"
      - "traefik.http.middlewares.ip-shield.plugin.routewarden.response.statusCode=403"
      - "traefik.http.middlewares.ip-shield.plugin.routewarden.response.body={\"error\":\"Forbidden\",\"message\":\"Restricted to trusted VPN / Internal IPs\"}"
