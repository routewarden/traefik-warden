displayName: RouteWarden
type: middleware
import: github.com/routewarden/traefik-warden
iconPath: assets/icon.png
bannerPath: assets/banner.png

summary: 'Block requests targeting sensitive endpoints, files (.env, configs, backups), or custom path regexes with custom JSON, HTML, Captcha, or status codes.'

testData:
  enabled: true
  enableDefaultPatterns: true
  pathPatterns:
    - '(?i)(^|/)(\.env.*|.*\.(txt|log|bak|backup|sql|conf|config|ini|yaml|yml))'
    - '(?i)^/admin/(secrets|internal)(/.*)?$'
  allowPatterns:
    - '(?i)^/robots\.txt$'
    - '(?i)^/ads\.txt$'
    - '(?i)^/\.well-known(/.*)?$'
  allowedIps:
    - '127.0.0.1'
    - '10.0.0.0/8'
  checkQuery: false
  response:
    mode: json
    statusCode: 403
    body: '{"error":"Forbidden","message":"Access to sensitive endpoint is blocked","status":403}'
    headers:
      X-RouteWarden-Protection: 'active'
