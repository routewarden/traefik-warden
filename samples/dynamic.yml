http:
  routers:
    # 1. Port 8080: Core & JSON mode
    router-8080:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8080]
      middlewares: [warden-8080]
      service: echo-service

    # 2. Port 8081: HTML mode
    router-8081:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8081]
      middlewares: [warden-8081]
      service: echo-service

    # 3. Port 8082: Plain Text mode
    router-8082:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8082]
      middlewares: [warden-8082]
      service: echo-service

    # 4. Port 8083: XML mode
    router-8083:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8083]
      middlewares: [warden-8083]
      service: echo-service

    # 5. Port 8084: Captcha mode (Turnstile challenge)
    router-8084:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8084]
      middlewares: [warden-8084]
      service: echo-service

    # 6. Port 8085: Redirect mode
    router-8085:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8085]
      middlewares: [warden-8085]
      service: echo-service

    # 7. Port 8086: RateLimitChallenge mode
    router-8086:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8086]
      middlewares: [warden-8086]
      service: echo-service

    # 8. Port 8087: FakeSuccess / Decoy mode
    router-8087:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8087]
      middlewares: [warden-8087]
      service: echo-service

    # 9. Port 8088: GzipBomb mode
    router-8088:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8088]
      middlewares: [warden-8088]
      service: echo-service

    # 10. Port 8089: SilentDrop mode
    router-8089:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8089]
      middlewares: [warden-8089]
      service: echo-service

    # 11. Port 8090: InfiniteStream mode
    router-8090:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8090]
      middlewares: [warden-8090]
      service: echo-service

    # 12. Port 8091: Proxy mode (forwarded to honeypot)
    router-8091:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8091]
      middlewares: [warden-8091]
      service: echo-service

    # 13. Port 8092: Disabled flag test
    router-8092:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8092]
      middlewares: [warden-8092]
      service: echo-service

    # 14. Port 8093: Methods filter test (inspects only POST & DELETE)
    router-8093:
      rule: "PathPrefix(`/`)"
      entryPoints: [ep8093]
      middlewares: [warden-8093]
      service: echo-service

  services:
    echo-service:
      loadBalancer:
        servers:
          - url: "http://echo-backend:8888"

  middlewares:
    # 1. Port 8080: Core & JSON mode (custom patterns, IP allowlist, check_query, debug, security_log)
    warden-8080:
      plugin:
        routewarden:
          enabled: true
          debug: true
          securityLog: true
          checkQuery: true
          pathPatterns:
            - "(?i)^/admin/secret.*$"
          allowPatterns:
            - "(?i)^/api/healthz$"
          allowedIps:
            - "192.168.100.50/32"
            - "10.99.0.0/16"
          methods:
            - GET
            - POST
          response:
            mode: json
            statusCode: 403
            headers:
              X-RouteWarden-Protection: Active
            body: "{\"error\":\"Access Denied\",\"security\":\"routewarden\"}"

    # 2. Port 8081: HTML mode
    warden-8081:
      plugin:
        routewarden:
          enabled: true
          response:
            mode: html
            statusCode: 403
            headers:
              X-RouteWarden-Mode: html
            body: "<html><body><h1>Access Denied by RouteWarden</h1></body></html>"

    # 3. Port 8082: Plain Text mode
    warden-8082:
      plugin:
        routewarden:
          enabled: true
          response:
            mode: text
            statusCode: 403
            headers:
              X-RouteWarden-Mode: text
            body: "Access Forbidden: RouteWarden Text Mode"

    # 4. Port 8083: XML mode
    warden-8083:
      plugin:
        routewarden:
          enabled: true
          response:
            mode: xml
            statusCode: 403
            headers:
              X-RouteWarden-Mode: xml

    # 5. Port 8084: Captcha mode (Turnstile challenge)
    warden-8084:
      plugin:
        routewarden:
          enabled: true
          response:
            mode: captcha
            statusCode: 403
            captcha:
              provider: "turnstile"
              siteKey: "0x4AAAAAAtestkey"
              title: "Security Verification Challenge"

    # 6. Port 8085: Redirect mode
    warden-8085:
      plugin:
        routewarden:
          enabled: true
          response:
            mode: redirect
            statusCode: 302
            redirectUrl: "https://honeypot.local/sinkhole"

    # 7. Port 8086: RateLimitChallenge mode
    warden-8086:
      plugin:
        routewarden:
          enabled: true
          response:
            mode: rateLimitChallenge
            statusCode: 429
            retryAfterSeconds: 180

    # 8. Port 8087: FakeSuccess / Decoy mode
    warden-8087:
      plugin:
        routewarden:
          enabled: true
          response:
            mode: fakeSuccess

    # 9. Port 8088: GzipBomb mode
    warden-8088:
      plugin:
        routewarden:
          enabled: true
          response:
            mode: gzipBomb
            statusCode: 200
            gzipBombMB: 1

    # 10. Port 8089: SilentDrop mode
    warden-8089:
      plugin:
        routewarden:
          enabled: true
          silentDrop: true

    # 11. Port 8090: InfiniteStream mode
    warden-8090:
      plugin:
        routewarden:
          enabled: true
          response:
            mode: infiniteStream
            statusCode: 200
            streamSizeMB: 2

    # 12. Port 8091: Proxy mode (forwarded to honeypot)
    warden-8091:
      plugin:
        routewarden:
          enabled: true
          response:
            mode: proxy
            proxyUrl: "http://honeypot:9999"

    # 13. Port 8092: Disabled flag test
    warden-8092:
      plugin:
        routewarden:
          enabled: false

    # 14. Port 8093: Methods filter test (inspects only POST & DELETE)
    warden-8093:
      plugin:
        routewarden:
          enabled: true
          methods:
            - POST
            - DELETE
          response:
            mode: json
            statusCode: 403
